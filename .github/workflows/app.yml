name: Приложение

on:
  schedule:
    - cron: "0 7 * * *"    # 10:00 МСК — свежие матчи и ставки
    - cron: "0 16 * * *"   # 19:00 МСК — обновление коэффициентов
    - cron: "13 4 * * 1"   # понедельник 07:13 МСК — перепроверка стратегии на истории
  workflow_dispatch:
    inputs:
      report:
        description: "Перепроверить стратегию на истории (5–15 мин)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["web/**", "match_analyzer/**", ".github/workflows/app.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: app
  cancel-in-progress: false

env:
  LEAGUES: ${{ vars.LEAGUES || 'E0 E1 E2 E3 SC0 SC1 D1 D2 SP1 SP2 I1 I2 F1 F2 N1 B1 P1 T1 G1' }}
  SEASONS: ${{ vars.SEASONS || '10' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/match-analyzer
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Нужна ли перепроверка стратегии
        id: need
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          path = "strategy/best_strategy.json"
          cfg = json.load(open(path)) if os.path.exists(path) else {}
          st = cfg.get("stats", {})
          same = (sorted(st.get("leagues", [])) == sorted(os.environ["LEAGUES"].split())
                  and str(st.get("seasons")) == os.environ["SEASONS"])
          print("report=" + ("false" if same else "true"))
          PY

      - name: Перепроверить стратегию
        if: github.event.schedule == '13 4 * * 1' || inputs.report || steps.need.outputs.report == 'true'
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then FLAG=""; else FLAG="--dry-run"; fi
          python -m match_analyzer notify report --leagues $LEAGUES --last $SEASONS $FLAG
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy/best_strategy.json
          git diff --cached --quiet || (git commit -m "Обновлена стратегия по итогам проверки" && git pull --rebase && git push)

      - name: Собрать приложение
        run: |
          TG=""
          if [ "${{ github.event.schedule }}" = "0 7 * * *" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then TG="--telegram"; fi
          python -m match_analyzer site --out _site --leagues $LEAGUES $TG \
            --app-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
