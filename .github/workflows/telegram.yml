name: Telegram

on:
  schedule:
    - cron: "0 7 * * *"    # ставки — каждый день в 10:00 по Москве
    - cron: "13 4 * * 1"   # проверка стратегии — по понедельникам в 07:13 по Москве
  workflow_dispatch:
    inputs:
      kind:
        description: "Что отправить"
        type: choice
        options: [tips, report]
        default: tips

permissions:
  contents: write

concurrency:
  group: telegram
  cancel-in-progress: false

env:
  LEAGUES: ${{ vars.LEAGUES || 'E0 D1 SP1 I1 F1' }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/match-analyzer
          key: football-data-${{ github.run_id }}
          restore-keys: football-data-

      - name: Что запускаем
        id: kind
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=${{ inputs.kind }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "13 4 * * 1" ]; then
            echo "kind=report" >> "$GITHUB_OUTPUT"
          else
            echo "kind=tips" >> "$GITHUB_OUTPUT"
          fi

      - name: Отправить в Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m match_analyzer notify ${{ steps.kind.outputs.kind }} --leagues $LEAGUES

      - name: Сохранить обновлённую стратегию
        if: steps.kind.outputs.kind == 'report'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategy/best_strategy.json
          git diff --cached --quiet || (git commit -m "Обновлена стратегия по итогам недельной проверки" && git push)
